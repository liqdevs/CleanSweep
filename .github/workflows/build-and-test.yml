name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CleanSweep.slnx

    - name: Build solution
      run: dotnet build CleanSweep.slnx -c Release --no-restore

    - name: Run unit tests
      run: dotnet test CleanSweep.Tests/CleanSweep.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish Standalone Executable
      run: |
        dotnet publish CleanSweep/CleanSweep.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish_out

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanSweep-Standalone-win-x64
        path: publish_out/CleanSweep.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download Standalone Executable
      uses: actions/download-artifact@v4
      with:
        name: CleanSweep-Standalone-win-x64
        path: release

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release create "$env:GITHUB_REF_NAME" "release/CleanSweep.exe#CleanSweep-win-x64.exe" --title "CleanSweep $env:GITHUB_REF_NAME" --generate-notes
      shell: pwsh
